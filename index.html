<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Trip Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
    />
    <script>
      try { if (localStorage.getItem("trip-planner-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <!-- Trip header: stays on screen; turns into one slim bar once you scroll -->
      <div class="stickyhead" id="sh">
        <header class="top2">
          <h1 class="h-title">
            <input id="ttl" class="ttl" type="text" aria-label="Trip name" placeholder="Trip name" />
          </h1>
          <div class="fbtns">
            <button type="button" id="f-theme" class="theme-btn" aria-label="Switch to light mode" title="Switch to light mode">
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></svg>
                <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8Z" /></svg>
              </button>
              <button type="button" id="f-new">New</button>
            <button type="button" id="f-open">Open</button>
            <button type="button" id="f-save" class="primary">Save</button>
            <button type="button" id="f-saveas">Save as</button>
            <input type="file" id="f-input" accept=".json,application/json" hidden />
          </div>
          <div class="ctl1">
            <div class="il">
              <span id="start-l">Starts</span>
              <button
                type="button"
                class="datebtn"
                id="start-btn"
                data-cal="start"
                aria-haspopup="dialog"
                aria-labelledby="start-l start-btn"
              ></button>
              <input type="hidden" id="start" />
            </div>
            <div class="il">
              <span id="end-l">Ends</span>
              <button
                type="button"
                class="datebtn"
                id="end-btn"
                data-cal="end"
                aria-haspopup="dialog"
                aria-labelledby="end-l end-btn"
              ></button>
              <input type="hidden" id="end" />
            </div>
            <span class="ndays" id="span"></span>
          </div>
          <div class="status" id="status" role="status"></div>
        </header>
      </div>
      <!-- Legend: each place's color (click a dot to change it). It sits right under the header and
           scrolls away beneath it as you move down the page. -->
      <div class="legend" id="legend" aria-label="Places and colors"></div>

      <div class="split">
        <!-- Day by day: one card per day, grouped by where you sleep -->
        <div id="days" class="days"></div>
        <!-- Schedule: hour-by-day grid of the same blocks -->
        <section id="board">
          <div class="board-head"><h2>Schedule</h2></div>
          <div class="scroller" id="scroller"><div class="sched" id="sched"></div></div>
        </section>
      </div>
    </div>

    <!-- Phones only: switch between just looking (View) and changing things (Edit) -->
    <div class="modebar" id="modebar" role="radiogroup" aria-label="View or edit">
      <button type="button" role="radio" data-mode="view" aria-checked="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6z" /><circle cx="10" cy="10" r="2.6" /></svg>
        View
      </button>
      <button type="button" role="radio" data-mode="edit" aria-checked="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.6 3.4l3 3L7 16l-3.8.8L4 13z" /><path d="M11.8 5.2l3 3" /></svg>
        Edit
      </button>
    </div>

    <!-- Floating panel for popovers (dropdowns, date picker, place name and color) -->
    <div class="pop" id="pop" role="dialog" hidden></div>

    <!-- Asks before New or Open would throw away unsaved changes -->
    <div class="scrim" id="ask" hidden>
      <div
        class="dialog"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="ask-t"
        aria-describedby="ask-d"
      >
        <h2 id="ask-t">Discard changes?</h2>
        <p id="ask-d"></p>
        <div class="dlg-acts">
          <button type="button" class="dlg-discard" data-ask="discard">Discard</button>
          <button type="button" class="dlg-save" data-ask="save">Save</button>
        </div>
      </div>
    </div>
  </body>
</html>
